# golangci-lint configuration
# Documentation: https://golangci-lint.run/usage/configuration/

run:
  timeout: 10m
  tests: true
  skip-dirs:
    - vendor
    - third_party
  skip-files:
    - ".*_test.go$"
  modules-download-mode: readonly
  allow-parallel-runners: true

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  unique-by-line: false

linters:
  enable:
    # Default linters
    - errcheck # Check for unchecked errors
    - gosimple # Simplify code
    - govet # Examine Go source code and reports suspicious constructs
    - ineffassign # Detect ineffectual assignments
    - staticcheck # Go static analysis tool
    - unused # Check for unused code

    # Additional security linters
    - gosec # Security checker
    - bodyclose # Check HTTP response body is closed
    - noctx # Detect sending http requests without context.Context

    # Code quality linters
    - gocyclo # Detect cyclomatic complexity
    - gofmt # Check if code is formatted
    - goimports # Check if imports are formatted
    - misspell # Spell checker
    - unconvert # Detect unnecessary type conversions
    - unparam # Detect unused function parameters
    - goconst # Detect repeated strings that could be constants
    - gocognit # Detect high cognitive complexity
    - nestif # Detect deeply nested if statements
    - prealloc # Find slice declarations that could be preallocated

    # Best practices
    - errname # Check error names
    - errorlint # Error wrapping best practices
    - gocritic # Comprehensive Go checker
    - goprintffuncname # Printf-like function naming
    - revive # Replacement for golint

  disable:
    - typecheck # Can conflict with generics

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close

  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G104 # Audit errors not checked (too noisy)
    config:
      G301: "0750"
      G302: "0600"
      G306: "0644"

  govet:
    check-shadowing: true
    enable-all: true

  gocyclo:
    min-complexity: 15

  gocognit:
    min-complexity: 20

  nestif:
    min-complexity: 5

  misspell:
    locale: US

  goconst:
    min-len: 3
    min-occurrences: 3

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
      - experimental
      - opinionated
    disabled-checks:
      - whyNoLint
      - unnamedResult

  revive:
    severity: warning
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

  # Exclude specific issues
  exclude-rules:
    # Exclude some linters from running on tests files
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - gosec
        - goconst

    # Ignore long lines in generated code
    - path: ".*\\.pb\\.go"
      linters:
        - lll

    # Allow fmt.Sprintf in errors
    - text: "Error return value of .((os\\.)?std(out|err)\\..*|.*Close|.*Flush|os\\.Remove(All)?|.*printf?|os\\.(Un)?Setenv). is not checked"
      linters:
        - errcheck

    # Allow underscores in const names for SQL compatibility
    - text: "don't use underscores in Go names"
      linters:
        - revive
      source: "const.*_(ID|URL|HTTP)"

severity:
  default-severity: error
  rules:
    - linters:
        - gocritic
      severity: warning
