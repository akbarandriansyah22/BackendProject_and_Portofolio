linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - gosimple
    - errorlint

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck

severity:
  rules:
    - linters:
        - govet
        - errcheck
      severity: error
    - linters:
        - staticcheck
        - gosimple
      severity: warning
