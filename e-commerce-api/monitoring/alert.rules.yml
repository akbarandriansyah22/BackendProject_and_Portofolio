# Prometheus Alert Rules for E-Commerce API
# These rules define conditions that trigger alerts

groups:
  - name: ecommerce_api
    interval: 30s
    rules:
      # =====================
      # SERVICE AVAILABILITY
      # =====================
      - alert: ServiceDown
        expr: up{job="ecommerce-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "E-Commerce API is DOWN"
          description: "E-Commerce API service has been unreachable for 2 minutes"
          runbook_url: "https://wiki.example.com/runbooks/service-down"

      # =====================
      # ERROR RATE
      # =====================
      - alert: HighErrorRate
        expr: |
          sum(rate(ecommerce_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(ecommerce_http_requests_total[5m]))
          > 0.05
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High HTTP error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over last 5 minutes (threshold: 5%)"
          runbook_url: "https://wiki.example.com/runbooks/high-error-rate"

      - alert: CriticalErrorRate
        expr: |
          sum(rate(ecommerce_http_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(ecommerce_http_requests_total[5m]))
          > 0.10
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "CRITICAL: Error rate exceeds 10%"
          description: "Error rate is {{ $value | humanizePercentage }} - immediate action required"
          runbook_url: "https://wiki.example.com/runbooks/high-error-rate"

      # =====================
      # LATENCY / PERFORMANCE
      # =====================
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95, 
            sum(rate(ecommerce_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1.0
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High API latency (p95 > 1s)"
          description: "95th percentile latency is {{ $value | humanizeDuration }} (threshold: 1s)"
          runbook_url: "https://wiki.example.com/runbooks/high-latency"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99, 
            sum(rate(ecommerce_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 5.0
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "CRITICAL: p99 latency exceeds 5s"
          description: "99th percentile latency is {{ $value | humanizeDuration }}"
          runbook_url: "https://wiki.example.com/runbooks/high-latency"

      # =====================
      # DATABASE CONNECTIVITY
      # =====================
      - alert: DatabaseConnectionError
        expr: rate(ecommerce_db_connection_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection errors detected"
          description: "Error rate: {{ $value | humanize }} errors/sec"
          runbook_url: "https://wiki.example.com/runbooks/db-connection-error"

      - alert: DatabaseConnectionPoolExhausted
        expr: ecommerce_db_connections_active > 20
        for: 5m
        labels:
          severity: warning
          component: database
        annotations:
          summary: "Database connection pool nearing limit"
          description: "Active connections: {{ $value }} (max: 25)"
          runbook_url: "https://wiki.example.com/runbooks/db-pool-exhausted"

      # =====================
      # TRAFFIC PATTERNS
      # =====================
      - alert: LowTraffic
        expr: sum(rate(ecommerce_http_requests_total[5m])) < 0.1
        for: 15m
        labels:
          severity: info
          component: api
        annotations:
          summary: "Abnormally low traffic"
          description: "Request rate is {{ $value | humanize }} req/sec (expected: > 0.1)"

      - alert: TrafficSpike
        expr: |
          rate(ecommerce_http_requests_total[5m]) 
          > 
          avg_over_time(rate(ecommerce_http_requests_total[5m])[1h:5m]) * 2
        for: 2m
        labels:
          severity: info
          component: api
        annotations:
          summary: "Unusual traffic spike detected"
          description: "Current request rate: {{ $value | humanize }} req/sec (baseline: 2x threshold)"

      # =====================
      # SPECIFIC ENDPOINTS
      # =====================
      - alert: HealthCheckFailing
        expr: rate(ecommerce_http_requests_total{path="/health", status!="200"}[5m]) > 0
        for: 2m
        labels:
          severity: critical
          component: api
          endpoint: health
        annotations:
          summary: "Health check endpoint returning non-200 status"
          description: "Health endpoint is not responding with 200 OK"
          runbook_url: "https://wiki.example.com/runbooks/health-check-failing"

      - alert: MetricsEndpointError
        expr: rate(ecommerce_http_requests_total{path="/metrics", status!="200"}[5m]) > 0
        for: 5m
        labels:
          severity: warning
          component: monitoring
          endpoint: metrics
        annotations:
          summary: "Metrics endpoint is failing"
          description: "Prometheus metrics endpoint returning non-200 status"

  # =====================
  # INFRASTRUCTURE ALERTS
  # =====================
  - name: infrastructure
    interval: 30s
    rules:
      - alert: PrometheusDown
        expr: up{job="prometheus"} == 0
        for: 2m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Prometheus is unreachable"
          description: "Prometheus monitoring service is down"
