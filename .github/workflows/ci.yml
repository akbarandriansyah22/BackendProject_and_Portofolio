name: Go CI + SAST + SCA + Docker Scan

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "e-commerce-api/go.mod"
          check-latest: false
          cache: true

      # =====================
      # Dependencies
      # =====================
      - name: Download dependencies
        run: |
          cd e-commerce-api
          go mod tidy 
          go mod download
          go mod verify

      # =====================
      # Static Analysis
      # =====================
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          working-directory: e-commerce-api
          args: --timeout=5m

      - name: Run GoSec (SAST)
        run: |
          cd e-commerce-api
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out ../gosec.sarif -no-fail ./...
        continue-on-error: true

      - name: Upload GoSec SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif

      # =====================
      # SCA
      # =====================
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: e-commerce-api
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif

      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif

      # =====================
      # Docker
      # =====================
      - name: Build Docker image
        run: |
          cd e-commerce-api
          docker build -t e-commerce-api:ci .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: e-commerce-api:ci
          severity: HIGH,CRITICAL
          exit-code: 0
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif

      # =====================
      # Test & Build
      # =====================
      - name: Run tests
        run: |
          cd e-commerce-api
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Build application
        run: |
          cd e-commerce-api
          go build -v -o bin/ecommerce-api ./server/cmd/main.go

      - name: Upload binary
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ecommerce-api-binary
          path: e-commerce-api/bin/ecommerce-api
          retention-days: 7
