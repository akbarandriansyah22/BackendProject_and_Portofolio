name: Go CI + DevSecOps Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================
      # Go Toolchain
      # =====================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.2"
          cache: true

      # =====================
      # Dependency Validation
      # =====================
      - name: Download & verify dependencies
        run: |
          cd e-commerce-api
          go mod tidy
          go mod download
          go mod verify

      # =====================
      # Secret Scanning
      # =====================
      # SECURITY GATE: Fail on any secrets found in codebase
      # Gitleaks detects: API keys, tokens, passwords, credentials
      # Impact: Prevents credential leaks before they reach production
      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2

      # =====================
      # Code Quality
      # =====================
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          working-directory: e-commerce-api
          args: --timeout=5m

      # =====================
      # SAST – GoSec
      # =====================
      # SECURITY GATE: Fail on HIGH/CRITICAL code vulnerabilities
      # GoSec scans: SQL injection, hardcoded secrets, insecure crypto, etc.
      # Impact: Prevents vulnerable code patterns from merging
      - name: Run GoSec (SAST)
        run: |
          cd e-commerce-api
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11
          # Run with minimum severity MEDIUM; exit code 1 on violations
          gosec -fmt sarif -out ../gosec.sarif -severity medium ./...

      - name: Upload GoSec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif
          category: gosec

      # =====================
      # SCA – Filesystem
      # =====================
      # SECURITY GATE: Fail on HIGH/CRITICAL vulnerabilities in dependencies
      # Trivy scans: Known CVEs in Go modules, lock files, manifests
      # Impact: Prevents supply-chain attacks and outdated dependencies
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: e-commerce-api
          format: sarif
          output: trivy-fs.sarif
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy FS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # =====================
      # Build Container
      # =====================
      - name: Build Docker image
        run: |
          cd e-commerce-api
          docker build -t e-commerce-api:ci .

      # =====================
      # Container Image Scan
      # =====================
      # SECURITY GATE: Fail on HIGH/CRITICAL vulnerabilities in Docker image
      # Trivy scans: Vulnerable OS packages (Alpine, Debian libs, etc.)
      # Impact: Ensures production container doesn't have known exploits
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: e-commerce-api:ci
          format: sarif
          output: trivy-image.sarif
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy Image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # =====================
      # SBOM – Supply Chain
      # =====================
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: e-commerce-api
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      # =====================
      # Test & Build
      # =====================
      - name: Run tests
        run: |
          cd e-commerce-api
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Build application
        run: |
          cd e-commerce-api
          go build -v -o bin/ecommerce-api ./server/cmd/main.go

      - name: Upload binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-api-binary
          path: e-commerce-api/bin/ecommerce-api
          retention-days: 7
