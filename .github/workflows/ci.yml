name: DevSecOps CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security-ci:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout Code
      # -------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # -------------------------
      # Secrets Scanning
      # -------------------------
      - name: Run Gitleaks (Secrets Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # SAST - Golang
      # -------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download Go dependencies
        run: |
          cd e-commerce-api
          go mod download

      - name: Run Gosec (SAST)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd e-commerce-api
          gosec -fmt=json -out=gosec-report.json -no-fail ./...
        continue-on-error: true

      - name: Upload Gosec Report
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: e-commerce-api/gosec-report.json

      # -------------------------
      # Dependency & Filesystem Scan
      # -------------------------
      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./e-commerce-api"
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy FS results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-fs-results.sarif"

      # -------------------------
      # Build Docker Image
      # -------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          cd e-commerce-api
          docker build -t devsecops-app:${{ github.sha }} .
          docker tag devsecops-app:${{ github.sha }} devsecops-app:latest

      # -------------------------
      # Container Image Scan
      # -------------------------
      - name: Run Trivy vulnerability scanner (Container Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devsecops-app:latest"
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy Image results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-image-results.sarif"

      # -------------------------
      # Summary Report
      # -------------------------
      - name: Security Scan Summary
        if: always()
        run: |
