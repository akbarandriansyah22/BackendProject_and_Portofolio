name: Go CI + DevSecOps Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - "e-commerce-api/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"
  pull_request:
    paths:
      - "e-commerce-api/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/cd.yml"

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.2"
          cache: true
          cache-dependency-path: e-commerce-api/go.sum

      - name: Download dependencies
        working-directory: e-commerce-api
        run: |
          go mod tidy
          go mod download
          go mod verify

      - name: Secret scanning (Gitleaks)
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-git --verbose

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          working-directory: e-commerce-api
          args: --timeout=5m

      - name: Run GoSec (SAST)
        working-directory: e-commerce-api
        run: |
          set -euo pipefail
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11
          # Fail the job on HIGH (and CRITICAL) findings. Medium/low are omitted.
          gosec -severity high -fmt text ./...
          gosec -severity high -fmt sarif -out gosec.sarif ./...

      - name: Upload GoSec SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: e-commerce-api/gosec.sarif
          category: gosec

      - name: Install Trivy
        run: |
          wget -qO- https://github.com/aquasecurity/trivy/releases/download/v0.69.3/trivy_0.69.3_Linux-64bit.tar.gz \
            | tar -xz -C /usr/local/bin trivy

      - name: Trivy filesystem scan
        run: |
          trivy fs \
            --format sarif \
            --output trivy-fs.sarif \
            --ignore-unfixed \
            e-commerce-api

      - name: Upload Trivy FS SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Build Docker image
        working-directory: e-commerce-api
        run: docker build -t e-commerce-api:ci .

      - name: Trivy image scan
        run: |
          trivy image \
            --format sarif \
            --output trivy-image.sarif \
            --ignore-unfixed \
            e-commerce-api:ci

      - name: Upload Trivy Image SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      - name: Generate SBOM
        run: |
          trivy fs \
            --format cyclonedx \
            --output sbom.json \
            e-commerce-api

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Run tests
        working-directory: e-commerce-api
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          echo "===== coverage ====="
          go tool cover -func=coverage.out

      - name: Build application
        working-directory: e-commerce-api
        run: |
          go build -v -o bin/ecommerce-api ./server/cmd

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-api-binary
          path: e-commerce-api/bin/ecommerce-api
          retention-days: 7
