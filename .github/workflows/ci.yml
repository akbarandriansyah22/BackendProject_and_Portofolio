name: Go CI + DevSecOps Pipeline

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =====================
      # Checkout
      # =====================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================
      # Setup Go
      # =====================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.2"
          cache: true

      # =====================
      # Dependencies
      # =====================
      - name: Download dependencies
        working-directory: e-commerce-api
        run: |
          go mod tidy
          go mod download
          go mod verify

      # =====================
      # Secret Scanning
      # =====================
      - name: Secret scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2

      # =====================
      # Lint
      # =====================
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          working-directory: e-commerce-api
          args: --timeout=5m

      # =====================
      # SAST – GoSec
      # =====================
      - name: Run GoSec (SAST)
        working-directory: e-commerce-api
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.11
          gosec -fmt sarif -out gosec.sarif ./... || true

      - name: Upload GoSec SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: e-commerce-api/gosec.sarif
          category: gosec

      # =====================
      # Trivy – Filesystem Scan
      # FIX: Ganti @0.33.1 → @0.30.0 (versi lama tidak kompatibel dengan runner terbaru)
      # =====================
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: e-commerce-api
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true

      - name: Upload Trivy FS SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # =====================
      # Build Docker Image
      # =====================
      - name: Build Docker image
        working-directory: e-commerce-api
        run: docker build -t e-commerce-api:ci .

      # =====================
      # Trivy – Image Scan
      # FIX: Ganti @0.33.1 → @0.30.0
      # =====================
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: e-commerce-api:ci
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true

      - name: Upload Trivy Image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # =====================
      # SBOM
      # FIX: Ganti @0.33.1 → @0.30.0
      # =====================
      - name: Generate SBOM
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: fs
          scan-ref: e-commerce-api
          format: cyclonedx
          output: sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      # =====================
      # Test
      # =====================
      - name: Run tests
        working-directory: e-commerce-api
        run: |
          go test -v -race -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      # =====================
      # Build App
      # =====================
      - name: Build application
        working-directory: e-commerce-api
        run: |
          go build -v -o bin/ecommerce-api ./server/cmd/main.go

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-api-binary
          path: e-commerce-api/bin/ecommerce-api
          retention-days: 7
