name: Go CI + SAST + SCA + Docker Scan

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          check-latest: false
          cache: true

      # =====================
      # Dependencies
      # =====================
      - name: Download dependencies
        run: |
          cd e-commerce-api
          go mod tidy 
          go mod download

      # =====================
      # Static Analysis
      # =====================
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.8.0
          working-directory: e-commerce-api
          args: --timeout=5m

      - name: Run GoSec (SAST)
        uses: securego/gosec@v2.22.0
        with:
          args: -fmt sarif -out gosec.sarif ./e-commerce-api/...
      - name: Upload GoSec SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif

      # =====================
      # SCA
      # =====================
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: e-commerce-api
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      # =====================
      # Docker
      # =====================
      - name: Build Docker image
        run: |
          cd e-commerce-api
          docker build -t e-commerce-api:ci .

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: e-commerce-api:ci
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      # =====================
      # Test & Build
      # =====================
      - name: Run tests
        run: |
          cd e-commerce-api
          go test ./...

      - name: Build application
        run: |
          cd e-commerce-api
          go build ./...
