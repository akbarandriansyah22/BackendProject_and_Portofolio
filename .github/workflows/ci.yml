name: E-Commerce API - CI/CD

# Path filter: Hanya jalan untuk e-commerce-api
on:
  push:
    branches: ["main"]
    paths:
      - "e-commerce-api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "e-commerce-api/**"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================
  # JOB 1: SECURITY SCAN
  # ============================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Secrets Scanning
      - name: Run Gitleaks (Secrets Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Setup Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('e-commerce-api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # SAST - Gosec
      - name: Run Gosec (SAST)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd e-commerce-api
          gosec -fmt=sarif -out=gosec-results.sarif -no-fail ./...
        continue-on-error: true

      - name: Upload Gosec to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: e-commerce-api/gosec-results.sarif
          category: gosec

      # Dependency Scan
      - name: Run Trivy (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./e-commerce-api"
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy FS to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: filesystem-scan

  # ============================================
  # JOB 2: BUILD & TEST
  # ============================================
  build-and-test:
    name: Build & Test Application
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: e-commerce-api/go.sum

      - name: Download dependencies
        run: |
          cd e-commerce-api
          go mod download

      # Build aplikasi (sesuai Dockerfile: ./cmd)
      - name: Build Application
        run: |
          cd e-commerce-api
          go build -v -o app ./server/cmd

      # Run tests
      - name: Run Tests
        run: |
          cd e-commerce-api
          go test -v ./... || echo "No tests found (skipped)"
        continue-on-error: true

  # ============================================
  # JOB 3: DOCKER BUILD & SCAN
  # ============================================
  docker-build:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Docker image
      - name: Build Docker image
        run: |
          cd e-commerce-api
          docker build -t ecommerce-api:${{ github.sha }} .
          docker tag ecommerce-api:${{ github.sha }} ecommerce-api:latest

      # Scan container image
      - name: Run Trivy (Container Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ecommerce-api:latest"
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy Image to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-image-results.sarif"
          category: container-scan

      - name: Show Image Info
        run: |
          echo "### ✅ Docker Build Success!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker images ecommerce-api:latest
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Image Size:** $(docker images ecommerce-api:latest --format '{{.Size}}')" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # JOB 4: SUMMARY
  # ============================================
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [security-scan, build-and-test, docker-build]
    if: always()

    steps:
      - name: Security Scan Summary
        run: |
          echo "# 🚀 E-Commerce API - CI/CD Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Project:** E-Commerce API" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔒 **Security Reports:** [View in Security Tab](https://github.com/${{ github.repository }}/security/code-scanning)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Docker Image:** \`ecommerce-api:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
