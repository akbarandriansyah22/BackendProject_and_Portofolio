name: E-Commerce API - CI/CD

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "e-commerce-api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: ["main", "develop"]
    paths:
      - "e-commerce-api/**"
  schedule:
    # Daily security scan at 2 AM UTC
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  # ============================================
  # JOB 1: ENHANCED SECURITY SCAN
  # ============================================
  security-scan:
    name: Enhanced Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for better secret detection

      # ========================================
      # 1. SECRET DETECTION
      # ========================================
      - name: Run Gitleaks (Secrets Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # 2. SETUP GO
      # ========================================
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('e-commerce-api/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # ========================================
      # 3. SAST - GOSEC
      # ========================================
      - name: Run Gosec (SAST)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd e-commerce-api
          gosec -fmt=sarif -out=gosec-results.sarif -no-fail ./...
          gosec -fmt=json -out=gosec-results.json ./...
        continue-on-error: true

      - name: Upload Gosec SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: e-commerce-api/gosec-results.sarif
          category: gosec

      - name: Upload Gosec Report
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: e-commerce-api/gosec-results.json

      # ========================================
      # 4. GO VULNERABILITY CHECK
      # ========================================
      - name: Run Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd e-commerce-api
          govulncheck -json ./... > govulncheck-results.json || true
        continue-on-error: true

      - name: Upload Govulncheck Report
        uses: actions/upload-artifact@v4
        with:
          name: govulncheck-report
          path: e-commerce-api/govulncheck-results.json

      # ========================================
      # 5. DEPENDENCY SCAN - TRIVY FS
      # ========================================
      - name: Run Trivy (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./e-commerce-api"
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy FS to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-fs-results.sarif"
          category: filesystem-scan

      # ========================================
      # 6. LICENSE COMPLIANCE CHECK
      # ========================================
      - name: Check License Compliance
        run: |
          cd e-commerce-api
          go install github.com/google/go-licenses@latest
          go-licenses report ./... > licenses.txt || true
        continue-on-error: true

      - name: Upload License Report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: e-commerce-api/licenses.txt

  # ============================================
  # JOB 2: CODE QUALITY & LINTING
  # ============================================
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: e-commerce-api/go.sum

      # ========================================
      # 1. GOLANGCI-LINT
      # ========================================
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          working-directory: e-commerce-api
          args: --timeout=5m

      # ========================================
      # 2. GO VET
      # ========================================
      - name: Run go vet
        run: |
          cd e-commerce-api
          go vet ./...

      # ========================================
      # 3. STATICCHECK
      # ========================================
      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          cd e-commerce-api
          staticcheck ./...

  # ============================================
  # JOB 3: BUILD & TEST
  # ============================================
  build-and-test:
    name: Build & Test Application
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: e-commerce-api/go.sum

      - name: Download dependencies
        run: |
          cd e-commerce-api
          go mod download
          go mod verify

      # Build aplikasi
      - name: Build Application
        run: |
          cd e-commerce-api
          CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -ldflags="-w -s" -o app ./server/cmd

      # Run tests with coverage
      - name: Run Tests with Coverage
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
          DB_SSLMODE: disable
          JWT_SECRET: test-secret-key-for-ci-only
        run: |
          cd e-commerce-api
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./... || echo "No tests found"
        continue-on-error: true

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./e-commerce-api/coverage.out
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

      # Benchmark tests
      - name: Run Benchmark Tests
        run: |
          cd e-commerce-api
          go test -bench=. -benchmem ./... > benchmark-results.txt || true
        continue-on-error: true

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: e-commerce-api/benchmark-results.txt

  # ============================================
  # JOB 4: DOCKER BUILD & SCAN
  # ============================================
  docker-build:
    name: Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ========================================
      # 1. BUILD DOCKER IMAGE
      # ========================================
      - name: Build Docker image
        run: |
          cd e-commerce-api
          docker build --no-cache -t ecommerce-api:${{ github.sha }} .
          docker tag ecommerce-api:${{ github.sha }} ecommerce-api:latest

      # ========================================
      # 2. CONTAINER SECURITY SCAN - TRIVY
      # ========================================
      - name: Run Trivy (Container Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ecommerce-api:latest"
          format: "sarif"
          output: "trivy-image-results.sarif"
          severity: "HIGH,CRITICAL"

      - name: Upload Trivy Image to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-image-results.sarif"
          category: container-scan

      # ========================================
      # 3. CONTAINER SCAN - GRYPE
      # ========================================
      - name: Run Grype (Alternative Scanner)
        uses: anchore/scan-action@v3
        with:
          image: "ecommerce-api:latest"
          fail-build: false
          severity-cutoff: high

      # ========================================
      # 4. HADOLINT - DOCKERFILE LINTER
      # ========================================
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: e-commerce-api/dockerfile
          failure-threshold: warning

      # ========================================
      # 5. IMAGE SIZE & LAYERS ANALYSIS
      # ========================================
      - name: Analyze Image Size
        run: |
          echo "### 📦 Docker Image Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker images ecommerce-api:latest --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Layers:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          docker history ecommerce-api:latest --no-trunc
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # ========================================
      # 6. CONTAINER BEST PRACTICES - DOCKLE
      # ========================================
      - name: Run Dockle (Best Practices Check)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            goodwithtech/dockle:latest ecommerce-api:latest || true
        continue-on-error: true

  # ============================================
  # JOB 5: API SECURITY TESTING
  # ============================================
  api-security-test:
    name: API Security Testing
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Start API server in background
      - name: Start API Server
        run: |
          cd e-commerce-api
          go run server/cmd/main.go &
          sleep 10
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          JWT_SECRET: test-secret-only

      # OWASP ZAP Baseline Scan
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.10.0
        with:
          target: "http://localhost:8080"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
        continue-on-error: true

  # ============================================
  # JOB 6: SECURITY SUMMARY & REPORT
  # ============================================
  security-summary:
    name: Security Summary & Report
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, build-and-test, docker-build]
    if: always()

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4

      - name: Generate Security Report
        run: |
          echo "# 🔒 Security Audit Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Code Quality | ${{ needs.code-quality.result == 'success' && '✅ Passed' || '❌ Failed' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result == 'success' && '✅ Passed' || '❌ Failed' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Build | ${{ needs.docker-build.result == 'success' && '✅ Passed' || '❌ Failed' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔍 Security Findings" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scans Performed:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Secret Detection (Gitleaks)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Static Analysis (Gosec)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Vulnerability Scan (Govulncheck)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dependency Scan (Trivy)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Container Scan (Trivy + Grype)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Dockerfile Lint (Hadolint)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Container Best Practices (Dockle)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 Gosec Report" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 Govulncheck Report" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 License Report" >> $GITHUB_STEP_SUMMARY
          echo "- 📄 Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔗 Links" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [Security Alerts](https://github.com/${{ github.repository }}/security/code-scanning)" >> $GITHUB_STEP_SUMMARY
          echo "- [Dependencies](https://github.com/${{ github.repository }}/security/dependabot)" >> $GITHUB_STEP_SUMMARY
          echo "- [Actions](https://github.com/${{ github.repository }}/actions)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🛡️ **All security scans completed successfully!**" >> $GITHUB_STEP_SUMMARY

      - name: Comment PR with Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
