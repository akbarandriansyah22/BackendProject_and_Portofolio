name: DAST Full Security Testing

on:
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 2 * * 0" # Weekly Sunday 2 AM
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  # ============================================
  # JOB 1: DEPLOY STAGING ENVIRONMENT
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build Application
        run: |
          cd e-commerce-api
          go build -o app ./server/cmd

      - name: Start API Server
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
          DB_SSLMODE: disable
          JWT_SECRET: test-secret-dast-only
          SERVER_PORT: 8080
        run: |
          cd e-commerce-api
          ./app &
          echo $! > api.pid

          # Wait for API to be ready
          timeout 60 bash -c 'until curl -s http://localhost:8080/health > /dev/null; do sleep 2; done'

          echo "API started on PID: $(cat api.pid)"

      - name: Verify API Health
        run: |
          response=$(curl -s http://localhost:8080/health)
          echo "Health check response: $response"

          if echo "$response" | grep -q "healthy"; then
            echo "✅ API is healthy and ready for testing"
          else
            echo "❌ API health check failed"
            exit 1
          fi

      # Keep service running for subsequent jobs
      - name: Upload API PID
        run: |
          echo "API_PID=$(cat e-commerce-api/api.pid)" >> $GITHUB_ENV

  # ============================================
  # JOB 2: OWASP ZAP FULL SCAN
  # ============================================
  zap-full-scan:
    name: OWASP ZAP Full Scan
    runs-on: ubuntu-latest
    needs: deploy-staging
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go & Start API
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Start Application
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
          JWT_SECRET: test-secret
        run: |
          cd e-commerce-api
          go run server/cmd/main.go &
          sleep 15

      # ZAP Full Scan
      - name: ZAP Full Scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: "http://localhost:8080"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j"
          allow_issue_writing: false
          artifact_name: "zap-full-scan"
        continue-on-error: true

      # ZAP API Scan
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.7.0
        with:
          target: "http://localhost:8080"
          format: openapi
          api_key: ${{ secrets.ZAP_API_KEY }}
          cmd_options: "-a"
        continue-on-error: true

      - name: Upload ZAP Results
        uses: actions/upload-artifact@v4
        with:
          name: zap-results
          path: |
            report_html.html
            report_json.json
            report_md.md

  # ============================================
  # JOB 3: API FUZZING
  # ============================================
  api-fuzzing:
    name: API Security Fuzzing
    runs-on: ubuntu-latest
    needs: deploy-staging
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go & Start API
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Start Application
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
          JWT_SECRET: test-secret
        run: |
          cd e-commerce-api
          go run server/cmd/main.go &
          sleep 15

      # Install fuzzing tools
      - name: Install ffuf
        run: |
          go install github.com/ffuf/ffuf@latest

      # SQL Injection fuzzing
      - name: SQL Injection Fuzzing
        run: |
          # Create payload list
          cat > sqli-payloads.txt << 'EOF'
          ' OR '1'='1
          '; DROP TABLE users--
          ' UNION SELECT NULL--
          admin'--
          ' OR 1=1--
          EOF

          ffuf -w sqli-payloads.txt \
            -u "http://localhost:8080/api/products?search=FUZZ" \
            -mc all \
            -o sqli-results.json \
            -of json || true

      # XSS fuzzing
      - name: XSS Fuzzing
        run: |
          cat > xss-payloads.txt << 'EOF'
          <script>alert('XSS')</script>
          <img src=x onerror=alert('XSS')>
          javascript:alert('XSS')
          <svg onload=alert('XSS')>
          EOF

          ffuf -w xss-payloads.txt \
            -u "http://localhost:8080/api/products?search=FUZZ" \
            -mc all \
            -o xss-results.json \
            -of json || true

      # Authentication bypass attempts
      - name: Auth Bypass Fuzzing
        run: |
          cat > auth-payloads.txt << 'EOF'
          ../../../etc/passwd
          ../../../../windows/system32/config/sam
          null
          %00
          ..%2F..%2F..%2Fetc%2Fpasswd
          EOF

          ffuf -w auth-payloads.txt \
            -u "http://localhost:8080/api/auth/FUZZ" \
            -mc all \
            -o auth-results.json \
            -of json || true

      - name: Upload Fuzzing Results
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-results
          path: |
            *-results.json

  # ============================================
  # JOB 4: NUCLEI VULNERABILITY SCAN
  # ============================================
  nuclei-scan:
    name: Nuclei Vulnerability Scan
    runs-on: ubuntu-latest
    needs: deploy-staging
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go & Start API
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Start Application
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
          JWT_SECRET: test-secret
        run: |
          cd e-commerce-api
          go run server/cmd/main.go &
          sleep 15

      - name: Run Nuclei Scan
        uses: projectdiscovery/nuclei-action@main
        with:
          target: http://localhost:8080
          templates: cves,vulnerabilities,exposures
          severity: critical,high,medium
          output: nuclei-results.txt

      - name: Upload Nuclei Results
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-results
          path: nuclei-results.txt

  # ============================================
  # JOB 5: SECURITY HEADERS CHECK
  # ============================================
  security-headers:
    name: Security Headers Validation
    runs-on: ubuntu-latest
    needs: deploy-staging
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go & Start API
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Start Application
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
          JWT_SECRET: test-secret
        run: |
          cd e-commerce-api
          go run server/cmd/main.go &
          sleep 15

      - name: Check Security Headers
        run: |
          echo "## 🔒 Security Headers Check" > headers-report.md
          echo "" >> headers-report.md

          # Check key security headers
          response=$(curl -sI http://localhost:8080)

          echo "### Response Headers:" >> headers-report.md
          echo "\`\`\`" >> headers-report.md
          echo "$response" >> headers-report.md
          echo "\`\`\`" >> headers-report.md
          echo "" >> headers-report.md

          echo "### Security Headers Status:" >> headers-report.md
          echo "| Header | Status |" >> headers-report.md
          echo "|--------|--------|" >> headers-report.md

          # Check each security header
          headers=(
            "X-Content-Type-Options"
            "X-Frame-Options"
            "X-XSS-Protection"
            "Strict-Transport-Security"
            "Content-Security-Policy"
          )

          for header in "${headers[@]}"; do
            if echo "$response" | grep -qi "^$header:"; then
              echo "| $header | ✅ Present |" >> headers-report.md
            else
              echo "| $header | ❌ Missing |" >> headers-report.md
            fi
          done

      - name: Upload Headers Report
        uses: actions/upload-artifact@v4
        with:
          name: security-headers-report
          path: headers-report.md

  # ============================================
  # JOB 6: DAST SUMMARY
  # ============================================
  dast-summary:
    name: DAST Summary Report
    runs-on: ubuntu-latest
    needs: [zap-full-scan, api-fuzzing, nuclei-scan, security-headers]
    if: always()

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Generate DAST Summary
        run: |
          echo "# 🎯 DAST Security Testing Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| OWASP ZAP Full Scan | ${{ needs.zap-full-scan.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| API Fuzzing | ${{ needs.api-fuzzing.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Nuclei Scan | ${{ needs.nuclei-scan.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Headers | ${{ needs.security-headers.result == 'success' && '✅' || '⚠️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🔍 Tests Performed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ OWASP ZAP Full Active Scan" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SQL Injection Fuzzing" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ XSS Attack Vectors" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Authentication Bypass Attempts" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Nuclei CVE & Vulnerability Scan" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Security Headers Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download detailed reports from the workflow artifacts" >> $GITHUB_STEP_SUMMARY
