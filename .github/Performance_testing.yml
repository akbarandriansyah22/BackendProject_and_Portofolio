name: Performance & Load Testing

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 4 * * 1" # Weekly Monday 4 AM
  workflow_dispatch:
    inputs:
      test_type:
        description: "Test type"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike

permissions:
  contents: read
  pull-requests: write

jobs:
  # ============================================
  # JOB 1: SMOKE TEST (Quick validation)
  # ============================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'smoke' || github.event_name != 'workflow_dispatch'
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Start Application
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
          JWT_SECRET: test-secret
        run: |
          cd e-commerce-api
          go run server/cmd/main.go &
          sleep 15

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create k6 Smoke Test Script
        run: |
          mkdir -p k6-tests
          cat > k6-tests/smoke.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate } from 'k6/metrics';

          const errorRate = new Rate('errors');

          export const options = {
            vus: 1,
            duration: '1m',
            thresholds: {
              http_req_duration: ['p(95)<500'], // 95% requests < 500ms
              errors: ['rate<0.1'], // Error rate < 10%
            },
          };

          export default function () {
            // Health check
            let res = http.get('http://localhost:8080/health');
            check(res, {
              'health check status is 200': (r) => r.status === 200,
              'health check response time < 200ms': (r) => r.timings.duration < 200,
            }) || errorRate.add(1);

            // Get products
            res = http.get('http://localhost:8080/api/products');
            check(res, {
              'products status is 200': (r) => r.status === 200,
              'products response time < 500ms': (r) => r.timings.duration < 500,
            }) || errorRate.add(1);

            sleep(1);
          }
          EOF

      - name: Run k6 Smoke Test
        run: |
          k6 run --out json=smoke-results.json k6-tests/smoke.js

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: smoke-results.json

  # ============================================
  # JOB 2: LOAD TEST (Normal load)
  # ============================================
  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'load' || github.event_name == 'schedule'
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Start Application
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
          JWT_SECRET: test-secret
        run: |
          cd e-commerce-api
          go run server/cmd/main.go &
          sleep 15

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create k6 Load Test Script
        run: |
          mkdir -p k6-tests
          cat > k6-tests/load.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate, Trend } from 'k6/metrics';

          const errorRate = new Rate('errors');
          const responseTime = new Trend('response_time');

          export const options = {
            stages: [
              { duration: '2m', target: 10 },  // Ramp up to 10 users
              { duration: '5m', target: 10 },  // Stay at 10 users
              { duration: '2m', target: 20 },  // Ramp up to 20 users
              { duration: '5m', target: 20 },  // Stay at 20 users
              { duration: '2m', target: 0 },   // Ramp down
            ],
            thresholds: {
              http_req_duration: ['p(95)<800'], // 95% requests < 800ms
              http_req_duration: ['p(99)<1200'], // 99% requests < 1.2s
              errors: ['rate<0.05'], // Error rate < 5%
              http_reqs: ['rate>10'], // Request rate > 10 req/s
            },
          };

          const scenarios = [
            { endpoint: '/api/products', weight: 50 },
            { endpoint: '/api/categories', weight: 30 },
            { endpoint: '/health', weight: 20 },
          ];

          export default function () {
            // Weighted random scenario selection
            const random = Math.random() * 100;
            let cumulative = 0;
            let endpoint = scenarios[0].endpoint;
            
            for (const scenario of scenarios) {
              cumulative += scenario.weight;
              if (random <= cumulative) {
                endpoint = scenario.endpoint;
                break;
              }
            }

            const res = http.get(`http://localhost:8080${endpoint}`);
            
            check(res, {
              'status is 200': (r) => r.status === 200,
              'response time < 800ms': (r) => r.timings.duration < 800,
            }) || errorRate.add(1);

            responseTime.add(res.timings.duration);
            
            sleep(1);
          }
          EOF

      - name: Run k6 Load Test
        run: |
          k6 run --out json=load-results.json k6-tests/load.js

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: load-results.json

  # ============================================
  # JOB 3: STRESS TEST (Breaking point)
  # ============================================
  stress-test:
    name: Stress Test
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'stress'
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Start Application
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
          JWT_SECRET: test-secret
        run: |
          cd e-commerce-api
          go run server/cmd/main.go &
          sleep 15

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create k6 Stress Test Script
        run: |
          mkdir -p k6-tests
          cat > k6-tests/stress.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export const options = {
            stages: [
              { duration: '2m', target: 10 },   // Warm up
              { duration: '5m', target: 50 },   // Push to 50 users
              { duration: '5m', target: 100 },  // Push to 100 users
              { duration: '5m', target: 150 },  // Push to 150 users
              { duration: '10m', target: 150 }, // Stay at 150 (breaking point)
              { duration: '3m', target: 0 },    // Ramp down
            ],
          };

          export default function () {
            const res = http.get('http://localhost:8080/api/products');
            check(res, {
              'status is 200': (r) => r.status === 200,
            });
            sleep(1);
          }
          EOF

      - name: Run k6 Stress Test
        run: |
          k6 run --out json=stress-results.json k6-tests/stress.js

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: stress-results.json

  # ============================================
  # JOB 4: SPIKE TEST (Sudden traffic surge)
  # ============================================
  spike-test:
    name: Spike Test
    runs-on: ubuntu-latest
    if: github.event.inputs.test_type == 'spike'
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
        ports:
          - 5432:5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Start Application
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: testuser
          DB_PASSWORD: testpass
          DB_NAME: testdb
          JWT_SECRET: test-secret
        run: |
          cd e-commerce-api
          go run server/cmd/main.go &
          sleep 15

      - name: Setup k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create k6 Spike Test Script
        run: |
          mkdir -p k6-tests
          cat > k6-tests/spike.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';

          export const options = {
            stages: [
              { duration: '10s', target: 10 },  // Normal load
              { duration: '1m', target: 200 },  // Spike to 200 users
              { duration: '3m', target: 200 },  // Stay at spike
              { duration: '10s', target: 10 },  // Return to normal
              { duration: '3m', target: 10 },   // Recover
              { duration: '10s', target: 0 },   // Ramp down
            ],
          };

          export default function () {
            const res = http.get('http://localhost:8080/api/products');
            check(res, {
              'status is 200': (r) => r.status === 200,
            });
            sleep(1);
          }
          EOF

      - name: Run k6 Spike Test
        run: |
          k6 run --out json=spike-results.json k6-tests/spike.js

      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: spike-test-results
          path: spike-results.json

  # ============================================
  # JOB 5: PERFORMANCE SUMMARY
  # ============================================
  performance-summary:
    name: Performance Test Summary
    runs-on: ubuntu-latest
    needs: [smoke-test, load-test]
    if: always()

    steps:
      - name: Download Results
        uses: actions/download-artifact@v4
        continue-on-error: true

      - name: Generate Performance Summary
        run: |
          echo "# ⚡ Performance Testing Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📊 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Type | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ${{ needs.smoke-test.result == 'success' && '✅ Pass' || needs.smoke-test.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} | ~1 min |" >> $GITHUB_STEP_SUMMARY
          echo "| Load Test | ${{ needs.load-test.result == 'success' && '✅ Pass' || needs.load-test.result == 'skipped' && '⏭️ Skipped' || '❌ Fail' }} | ~16 min |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🎯 Performance Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Target SLOs:" >> $GITHUB_STEP_SUMMARY
          echo "- P95 Response Time: < 800ms" >> $GITHUB_STEP_SUMMARY
          echo "- P99 Response Time: < 1200ms" >> $GITHUB_STEP_SUMMARY
          echo "- Error Rate: < 5%" >> $GITHUB_STEP_SUMMARY
          echo "- Throughput: > 10 req/s" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Download detailed k6 JSON results from workflow artifacts" >> $GITHUB_STEP_SUMMARY
