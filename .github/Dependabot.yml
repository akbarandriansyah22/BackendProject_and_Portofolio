# Dependabot configuration for automated dependency updates
# Documentation: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ============================================
  # Go Modules Dependencies
  # ============================================
  - package-ecosystem: "gomod"
    directory: "/e-commerce-api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "your-team-name" # Replace with your team
    assignees:
      - "your-username" # Replace with maintainer
    labels:
      - "dependencies"
      - "go"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group updates by dependency type
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "security"
      minor-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Security updates immediately
    versioning-strategy: increase
    # Auto-approve minor/patch updates (optional)
    # Requires GitHub Actions workflow
    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"
    ignore:
      # Ignore specific dependencies if needed
      # - dependency-name: "github.com/example/package"
      #   versions: ["1.x"]

  # ============================================
  # GitHub Actions
  # ============================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "your-team-name"
    assignees:
      - "your-username"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"

  # ============================================
  # Docker
  # ============================================
  - package-ecosystem: "docker"
    directory: "/e-commerce-api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    reviewers:
      - "your-team-name"
    assignees:
      - "your-username"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"
